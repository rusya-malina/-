name: Render health monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: render-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_URL: https://test-project-0seb.onrender.com/healthz

    steps:
      - name: Check Render health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Health check attempt ${attempt}/3: ${HEALTH_URL}"

            if response="$(curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 45 \
                --retry 1 \
                --retry-delay 5 \
                "${HEALTH_URL}")"; then
              if [[ "${response}" == "OK" ]]; then
                echo "Render health check passed: HTTP 200 and body OK."
                exit 0
              fi
              echo "Unexpected response from ${HEALTH_URL}: ${response}"
            else
              echo "Request failed on attempt ${attempt}."
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              sleep 10
            fi
          done

          echo "Render health check failed after 3 attempts."
          exit 1
