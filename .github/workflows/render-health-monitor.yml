name: Render health monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEALTH_URL: https://test-project-0seb.onrender.com/healthz
      MONITOR_UNTIL: "2026-08-20T13:41:32Z"

    steps:
      - name: Stop after the 24-hour window
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          end="$(date -u -d "$MONITOR_UNTIL" +%s)"
          if (( now >= end )); then
            echo "The 24-hour monitoring window has ended at $MONITOR_UNTIL."
            gh workflow disable render-health-monitor.yml --repo "${{ github.repository }}" || true
            exit 0
          fi
          echo "Monitoring until $MONITOR_UNTIL (current UTC: $(date -u -Is))."

      - name: Check Render health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 45 "$HEALTH_URL")"
          if [[ "$response" != "OK" ]]; then
            echo "Unexpected response from $HEALTH_URL: $response"
            exit 1
          fi
          echo "Render health check passed: HTTP 200 and body OK."
