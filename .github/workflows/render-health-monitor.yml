name: Render health monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram alert"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: render-health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_URL: https://test-project-0seb.onrender.com/healthz

    steps:
      - name: Check Render health endpoint
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Health check attempt ${attempt}/3: ${HEALTH_URL}"

            if response="$(curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --max-time 45 \
                --retry 1 \
                --retry-delay 5 \
                "${HEALTH_URL}")"; then
              if [[ "${response}" == "OK" ]]; then
                echo "Render health check passed: HTTP 200 and body OK."
                exit 0
              fi
              echo "Unexpected response from ${HEALTH_URL}: ${response}"
            else
              echo "Request failed on attempt ${attempt}."
            fi

            if [[ "${attempt}" -lt 3 ]]; then
              sleep 10
            fi
          done

          echo "Render health check failed after 3 attempts."
          exit 1

      - name: Notify Telegram about failure or test
        if: failure() || inputs.test_alert == 'true'
        continue-on-error: true
        env:
          MONITOR_BOT_TOKEN: ${{ secrets.MONITOR_BOT_TOKEN }}
          MONITOR_CHAT_ID: ${{ secrets.MONITOR_CHAT_ID }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MONITOR_BOT_TOKEN}" || -z "${MONITOR_CHAT_ID}" ]]; then
            echo "Telegram notification skipped: MONITOR_BOT_TOKEN or MONITOR_CHAT_ID is not configured."
            exit 0
          fi

          if [[ "${{ inputs.test_alert }}" == "true" ]]; then
            title="KPI bot monitor test"
          else
            title="KPI bot monitor alert"
          fi

          text="${title}
          Render URL: ${HEALTH_URL}
          Repository: ${GITHUB_REPOSITORY}
          Workflow: ${GITHUB_WORKFLOW}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}
          Time: $(date -u -Is)"

          curl --fail --silent --show-error --max-time 20 \
            --retry 2 \
            --retry-delay 3 \
            -X POST \
            "https://api.telegram.org/bot${MONITOR_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${MONITOR_CHAT_ID}" \
            --data-urlencode "text=${text}"
