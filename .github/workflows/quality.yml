name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt ruff

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run Ruff
        run: ruff check .

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tools/test_architecture_contract.py \
            tools/test_schema_migration.py \
            tools/test_admin_modes.py \
            tools/test_permissions.py \
            tools/test_polling_recovery.py \
            tools/test_rewrite_contracts.py \
            tools/test_runtime_contracts.py \
            tools/test_kpi_service.py \
            tools/test_plan_projection.py \
            tools/test_plan_edge_cases.py \
            tools/test_issuance_service.py \
            tools/test_import_service.py \
            tools/test_kpi_notifications.py \
            tools/test_profile_service.py \
            tools/test_admin_delete_flow.py \
            tools/test_identity_archive.py \
            tools/test_health_endpoints.py \
            tools/test_team_service.py \
            tools/test_shadow_validation.py \
            tools/test_excel_preview.py \
            tools/test_broadcast_media.py \
            tools/test_concurrent_latest_files.py \
            tools/test_github_sync.py \
            tools/test_hierarchy.py \
            tools/test_latest_file_policy.py \
            tools/test_modular_bot.py \
            tools/test_registration_approval_consistency.py \
            tools/test_role_simulation.py \
            tools/test_storage_atomicity.py \
            tools/test_storage_errors.py \
            tools/data_audit.py \
            tools/test_unified_employee_reports.py \
            tools/verify_admin_request_flow.py \
            tools/deep_audit.py \
            tools/behavior_audit.py \
            tools/data_audit.py \
            tools/runtime_name_audit.py; do
            echo "=== ${test} ==="
            python "${test}"
          done
